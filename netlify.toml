# Netlify configuration for Angular SPA Portfolio

[build]
  base = "portfolio-kele"
  command = "npm install && npm run build"
  publish = "dist/portfolio-kele/browser"

[build.environment]
  NODE_VERSION = "20"

# Redirect all requests to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
