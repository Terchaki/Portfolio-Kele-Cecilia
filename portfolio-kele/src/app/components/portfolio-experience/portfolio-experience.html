<section class="timeline" id="experiencias">
  <div class="section-heading">
    <span class="section-label">Experiências</span>
    <h2>Experiências em destaque com evolucao de atendimento para SDR.</h2>
  </div>

  <div class="timeline__items">
    @for (item of items; track item.title) {
      <article class="panel timeline-card" [class.timeline-card--current]="item.isCurrent">
        @if (item.isCurrent) {
          <span class="timeline-card__badge">Atual</span>
        }
        <span class="timeline-card__context">{{ item.context }}</span>
        <h3>{{ item.title }}</h3>
        <p>{{ item.description }}</p>
      </article>
    }
  </div>
</section>
