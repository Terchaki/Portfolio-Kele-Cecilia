<header class="topbar" [class.menu-open]="menuOpen">
  <a class="brand" href="#inicio" (click)="closeMenu()">
    <span class="brand__mark">KC</span>
    <span>
      <strong>Kele Cecilia</strong>
      <small>Portfolio profissional</small>
    </span>
  </a>

  <button class="hamburger" type="button" [class.is-open]="menuOpen" (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen" aria-label="Menu de navegação">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav class="topbar__nav" [class.is-open]="menuOpen" aria-label="Seções do portfolio">
    <a href="#perfil" (click)="closeMenu()">Perfil</a>
    <a href="#experiencias" (click)="closeMenu()">Experiências</a>
    <a href="#formacao" (click)="closeMenu()">Cursos</a>
    <a href="#contato" (click)="closeMenu()">Contato</a>
  </nav>

  <div class="theme-switcher" aria-label="Alternar tema visual">
    <button type="button" class="theme-switcher__button" [class.is-active]="currentTheme === 'light'"
      (click)="setTheme('light')" title="Tema Claro">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
        <circle cx="10" cy="10" r="4" />
        <line x1="10" y1="2" x2="10" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        <line x1="10" y1="16" x2="10" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        <line x1="18" y1="10" x2="16" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        <line x1="4" y1="10" x2="2" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        <line x1="15.6" y1="4.4" x2="14.1" y2="5.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        <line x1="5.9" y1="14.1" x2="4.4" y2="15.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        <line x1="4.4" y1="4.4" x2="5.9" y2="5.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        <line x1="14.1" y1="14.1" x2="15.6" y2="15.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
    </button>
    <button type="button" class="theme-switcher__button" [class.is-active]="currentTheme === 'spotlight'"
      (click)="setTheme('spotlight')" title="Tema Escuro">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
        <path
          d="M17.3 13.5c-1.9 1.3-4.3 2-6.8 2-6.1 0-11-4.9-11-11 0-2.5.7-4.9 2-6.8 4.1.9 7.1 4.5 7.1 8.8 0 4.3-3 7.9-7.1 8.8 1.9 1.3 4.3 2 6.8 2 6.1 0 11-4.9 11-11 0-2.5-.7-4.9-2-6.8z" />
      </svg>
    </button>
  </div>
</header>
