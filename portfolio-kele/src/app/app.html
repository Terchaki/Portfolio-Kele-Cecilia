<div class="portfolio-shell" [class.portfolio-shell--spotlight]="currentTheme() === 'spotlight'">
  <div class="backdrop backdrop--one"></div>
  <div class="backdrop backdrop--two"></div>

  <app-portfolio-topbar [currentTheme]="currentTheme()" (themeChange)="setTheme($event)"></app-portfolio-topbar>

  <main class="page" id="inicio">
    <app-portfolio-hero></app-portfolio-hero>
    <app-portfolio-highlights [items]="highlights"></app-portfolio-highlights>
    <app-portfolio-profile></app-portfolio-profile>
    <app-portfolio-experience [items]="journey"></app-portfolio-experience>
    <app-portfolio-learning [items]="learning"></app-portfolio-learning>
    <app-portfolio-contact [items]="contactItems"></app-portfolio-contact>
  </main>

  <app-portfolio-footer></app-portfolio-footer>

  <button
    type="button"
    class="scroll-top"
    [class.scroll-top--visible]="showScrollTop()"
    (click)="scrollToTop()"
    aria-label="Voltar ao topo"
    title="Voltar ao topo"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" aria-hidden="true">
      <path d="M12 19V5"></path>
      <path d="M5 12l7-7 7 7"></path>
    </svg>
  </button>
</div>
